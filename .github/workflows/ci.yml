name: CI

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'info'
  push:
    branches: [ main, milestone_3 ]
  pull_request:
    branches: [ main, milestone_3 ]

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      
    - name: Install apt-get packages
      run: |
        echo RESET grub-efi/install_devices | sudo debconf-communicate grub-pc
        sudo ACCEPT_EULA=Y apt-get update
        sudo ACCEPT_EULA=Y apt-get upgrade
        sudo apt-get install wget git curl software-properties-common build-essential
    
    - name: Install Rust target for wasm
      run: |
        rustup target add wasm32-wasip1
        
    - name: Install WasmEdge
      run: |
        VERSION=0.14.1
        curl -sSf https://raw.githubusercontent.com/WasmEdge/WasmEdge/master/utils/install.sh | bash -s -- -v $VERSION
    
    - name: microservice
      run: |
        cargo build --target wasm32-wasip1 --release
        wasmedgec target/wasm32-wasip1/release/sales_tax_rate_lookup.wasm sales_tax_rate_lookup.wasm
        nohup wasmedge sales_tax_rate_lookup.wasm &
        echo $! > wasmedge.pid
        sleep 15
        resp=$(curl http://localhost:8001/find_rate -X POST -d "78701")
        echo "$resp"
        if [[ $resp == "0.0825" ]]; then
          echo -e "Execution Success!"
        else
          echo -e "Execution Fail!"
          exit 1
        fi
        sleep 15
        resp=$(curl http://localhost:8001/find_rate -X POST -d "89102")
        echo "$resp"
        if [[ $resp == "0.08375" ]]; then
          echo -e "Execution Success!"
        else
          echo -e "Execution Fail!"
          exit 1
        fi
        resp=$(curl -w "%{http_code}" -s -o /dev/null http://localhost:8001/find_rate -X POST -d "12345")
        echo "Status code: $resp"
        if [[ $resp == "404" ]]; then
          echo -e "Execution Success! Got 404 as expected"
        else
          echo -e "Execution Fail! Expected 404 but got $resp"
          exit 1
        fi
        kill -9 `cat wasmedge.pid`
        rm wasmedge.pid
